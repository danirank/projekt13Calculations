name: Reusable Python Workflow

"on":
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      requirements-file:
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
          cache-dependency-path: ${{ inputs.requirements-file }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ inputs.requirements-file }}
          pip install ruff pytest pytest-cov

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Run tests with coverage 
        run: pytest --cov=app  --cov-report=html --cov-report=term-missing --cov-fail-under=60
        
      
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/

      - name: Add coverage to summary
        if: always()
        run: |
        echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
        pytest --cov=app --cov-report=term >> $GITHUB_STEP_SUMMARY

      